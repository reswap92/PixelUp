<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>TRANSMIND LIVE | 23-24 Ottobre 2027</title>

  <meta
    name="description"
    content="TRANSMIND LIVE - 23 e 24 ottobre 2027, Teatro Teca, Cassano d'Adda."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #090807;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #090807;
    }

    .poster-container {
      position: relative;
      width: 100%;
      max-width: 1024px;
      line-height: 0;
      overflow: hidden;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      AREA CLICCABILE SOPRA IL PULSANTE
      "ACQUISTA IL TUO BIGLIETTO"
    */
    .buy-button {
      position: absolute;

      left: 26%;
      top: 74.4%;

      width: 48%;
      height: 4.4%;

      border-radius: 50px;

      z-index: 10;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    /*
      AREA DEL QR CODE.

      Per ora cliccandolo si apre qr.html.
      Successivamente inseriremo anche il QR definitivo.
    */
    .qr-link {
      position: absolute;

      left: 83%;
      top: 80.5%;

      width: 14%;
      height: 10%;

      z-index: 10;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .buy-button:focus-visible,
    .qr-link:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      .poster-container {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="poster-container">

      <!-- LOCANDINA TRANSMIND -->
      <img
        src="assets/transmind-live-poster.jpg"
        class="poster"
        alt="TRANSMIND LIVE - 23 e 24 ottobre 2027"
      >

      <!-- ACQUISTA IL TUO BIGLIETTO -->
      <a
        href="acquista.html"
        class="buy-button"
        aria-label="Acquista il tuo biglietto TRANSMIND LIVE"
      ></a>

      <!-- QR / SCOPRI DI PIÙ -->
      <a
        href="qr.html"
        class="qr-link"
        aria-label="Scopri di più su TRANSMIND LIVE"
      ></a>

    </div>

  </main>

</body>
</html>
