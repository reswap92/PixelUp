<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>TRANSMIND LIVE | 23-24 Ottobre 2027</title>

  <meta
    name="description"
    content="TRANSMIND LIVE - 23 e 24 ottobre 2027, Teatro Teca, Cassano d'Adda."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #090807;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       PAGINA
    ========================= */

    .page {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #090807;
    }

    /* =========================
       LOCANDINA
    ========================= */

    .poster-container {
      position: relative;
      width: 100%;
      max-width: 1024px;
      line-height: 0;
      overflow: hidden;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
    }

    /* =========================
       ACQUISTA IL TUO BIGLIETTO

       Area trasparente cliccabile
       posizionata sopra il pulsante
       presente nella locandina.
    ========================= */

    .buy-button {
      position: absolute;

      left: 26%;
      top: 74.4%;

      width: 48%;
      height: 4.4%;

      border-radius: 50px;

      z-index: 10;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .buy-button:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .poster-container {
        width: 100%;
      }

    }

  </style>
</head>

<body>

  <main class="page">

    <div class="poster-container">

      <!-- =====================
           LOCANDINA TRANSMIND

           Il QR definitivo è già
           incorporato nell'immagine.
      ====================== -->

      <img
        src="assets/transmind-live-poster.jpg"
        class="poster"
        alt="TRANSMIND LIVE - 23 e 24 ottobre 2027"
      >

          <!-- =====================
           ACQUISTA IL TUO BIGLIETTO
      ====================== -->

      <a
        href="preacquisto.html"
        class="buy-button"
        aria-label="Acquista il tuo biglietto TRANSMIND LIVE"
      ></a>


      <!-- =====================
           SCOPRI L'EVENTO
           PULSANTE SOTTO LA LOCANDINA
      ====================== -->

      <div style="
        width:100%;
        clear:both;
        box-sizing:border-box;
        text-align:center;
        padding:35px 20px 50px;
        background:#0d0907;
        line-height:1.5;
      ">

        <p style="
          color:#d9cec5;
          font-size:15px;
          margin:0 0 20px;
          line-height:1.6;
        ">
          Stai visualizzando la locandina dal cellulare?<br>
          Scopri tutti i dettagli dell'evento
          senza scansionare il QR Code.
        </p>

        <a
          href="qr.html"
          style="
            display:inline-block;
            padding:17px 35px;
            background:linear-gradient(135deg,#c99556,#e7bd84);
            color:#0d0907;
            border-radius:30px;
            font-size:16px;
            font-weight:700;
            text-decoration:none;
            box-shadow:0 10px 30px rgba(0,0,0,.35);
          "
        >
          ✨ SCOPRI L'EVENTO →
        </a>

      </div>

    </div>

  </main>

</body>
</html>
