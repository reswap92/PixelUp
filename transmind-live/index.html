<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>TRANSMIND LIVE | 23-24 Ottobre 2027</title>

  <meta
    name="description"
    content="TRANSMIND LIVE - 23 e 24 ottobre 2027, Teatro Teca, Cassano d'Adda."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #090807;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       PAGINA
    ========================= */

    .page {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #090807;
    }

    /* =========================
       LOCANDINA
    ========================= */

    .poster-container {
      position: relative;
      width: 100%;
      max-width: 1024px;
      line-height: 0;
      overflow: hidden;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
    }

    /* =========================
       ACQUISTA IL TUO BIGLIETTO

       Area trasparente cliccabile
       posizionata sopra il pulsante
       presente nella locandina.
    ========================= */

    .buy-button {
      position: absolute;

      left: 26%;
      top: 74.4%;

      width: 48%;
      height: 4.4%;

      border-radius: 50px;

      z-index: 10;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .buy-button:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .poster-container {
        width: 100%;
      }

    }

  </style>
</head>

<body>

  <main class="page">

    <div class="poster-container">

      <!-- =====================
           LOCANDINA TRANSMIND

           Il QR definitivo è già
           incorporato nell'immagine.
      ====================== -->

      <img
        src="assets/transmind-live-poster.jpg"
        class="poster"
        alt="TRANSMIND LIVE - 23 e 24 ottobre 2027"
      >


      <!-- =====================
           ACQUISTA IL TUO BIGLIETTO
      ====================== -->

      <a
        href="acquista.html"
        class="buy-button"
        aria-label="Acquista il tuo biglietto TRANSMIND LIVE"
      ></a>

    </div>

  </main>

</body>
</html>
