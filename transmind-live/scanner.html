<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRANSMIND LIVE - Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .box {
      background: #151515;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #080808;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #c9a84c;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #222;
      color: white;
      border: 1px solid #555;
      margin-top: 12px;
    }

    #scannerBox {
      display: none;
    }

    #reader {
      overflow: hidden;
      border-radius: 15px;
    }

    #result {
      display: none;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      margin-top: 20px;
    }

    #result.valid {
      display: block;
      background: #12391e;
      border: 3px solid #31cb69;
    }

    #result.used {
      display: block;
      background: #49300e;
      border: 3px solid #f0a72f;
    }

    #result.invalid {
      display: block;
      background: #461616;
      border: 3px solid #e55353;
    }

    #result h2 {
      font-size: 28px;
      margin: 0 0 15px;
    }

    .person {
      font-size: 23px;
      font-weight: bold;
      margin: 10px 0;
    }

    .info {
      margin: 7px 0;
      color: #ddd;
    }

    #operatorInfo {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-bottom: 15px;
    }

    #logoutButton {
      display: none;
      background: transparent;
      color: #aaa;
      border: 1px solid #444;
      margin-bottom: 20px;
    }

    .error {
      color: #ff7777;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>TRANSMIND LIVE</h1>

  <div class="subtitle">
    CONTROLLO INGRESSI
  </div>


  <!-- LOGIN STAFF -->

  <div id="loginBox" class="box">

    <input
      id="email"
      type="email"
      placeholder="Email staff"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="loginButton">
      ACCEDI
    </button>

    <div id="loginError" class="error"></div>

  </div>


  <div id="operatorInfo"></div>

  <button
    id="logoutButton"
    class="secondary"
  >
    ESCI
  </button>


  <!-- SCANNER -->

 <div id="scannerBox" class="box">

  <button id="startCameraButton">
    ATTIVA FOTOCAMERA
  </button>

  <div id="reader" style="margin-top:15px;"></div>

</div>


  <!-- RISULTATO -->

  <div id="result">

    <h2 id="resultTitle"></h2>

    <div
      id="resultName"
      class="person"
    ></div>

    <div
      id="resultTicket"
      class="info"
    ></div>

    <div
      id="resultCode"
      class="info"
    ></div>

    <button
      id="nextButton"
      style="margin-top:20px"
    >
      SCANSIONA PROSSIMO
    </button>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyD0kpQb-t5aJrMQ9mNnvJgl53Fe8UgPwrc",

    authDomain:
      "backtag-16de3.firebaseapp.com",

    projectId:
      "backtag-16de3",

    storageBucket:
      "backtag-16de3.firebasestorage.app",

    messagingSenderId:
      "415455463905",

    appId:
      "1:415455463905:web:abd5e58bdeaaf6e3b9eaa0"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);


  const loginBox =
    document.getElementById("loginBox");

  const scannerBox =
    document.getElementById("scannerBox");

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const loginError =
    document.getElementById("loginError");

  const operatorInfo =
    document.getElementById("operatorInfo");

  const result =
    document.getElementById("result");

  const resultTitle =
    document.getElementById("resultTitle");

  const resultName =
    document.getElementById("resultName");

  const resultTicket =
    document.getElementById("resultTicket");

  const resultCode =
    document.getElementById("resultCode");

  const nextButton =
    document.getElementById("nextButton");


  let scanner = null;

  let scanLocked = false;


  loginButton.addEventListener(
    "click",
    async () => {

      loginError.textContent = "";

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if (!email || !password) {

        loginError.textContent =
          "Inserisci email e password.";

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "ACCESSO...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }

      catch (error) {

        console.error(error);

        loginError.textContent =
          "Email o password non corrette.";

      }

      finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "ACCEDI";

      }

    }
  );


  logoutButton.addEventListener(
    "click",
    async () => {

      if (scanner) {

        try {
          await scanner.stop();
        }
        catch (_) {}

      }

      await signOut(auth);

    }
  );


  onAuthStateChanged(
    auth,
    async (user) => {

      if (user) {

        loginBox.style.display =
          "none";

        logoutButton.style.display =
          "block";

        operatorInfo.textContent =
          "Operatore: " + user.email;

        scannerBox.style.display =
          "block";



      }

      else {

        loginBox.style.display =
          "block";

        logoutButton.style.display =
          "none";

        operatorInfo.textContent =
          "";

        scannerBox.style.display =
          "none";

        result.style.display =
          "none";

      }

    }
  );
  
document
  .getElementById("startCameraButton")
  .addEventListener(
    "click",
    async () => {

      document
        .getElementById("startCameraButton")
        .style.display = "none";

      await startScanner();

    }
  );

  async function startScanner() {

    scanLocked = false;

    result.className = "";

    result.style.display =
      "none";

    scannerBox.style.display =
      "block";


    if (!scanner) {

      scanner =
        new Html5Qrcode(
          "reader"
        );

    }


    try {

      await scanner.start(

        {
          facingMode:
            "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }
        },

        async (decodedText) => {

          if (scanLocked) {
            return;
          }

          scanLocked = true;

          await processQr(
            decodedText
          );

        },

        () => {}

      );

    }

    catch (error) {

      console.error(error);

      alert(
        "Impossibile aprire la fotocamera. Controlla i permessi del browser."
      );

    }

  }


  async function processQr(
    decodedText
  ) {

    try {

      let token = "";

      let booking = "";


      try {

        const url =
          new URL(decodedText);

        token =
          url.searchParams
            .get("token") || "";

        booking =
          url.searchParams
            .get("booking") || "";

      }

      catch (_) {

        token =
          decodedText.trim();

      }


      if (!token) {

        showResult(
          "invalid",
          "BIGLIETTO NON VALIDO",
          "",
          "",
          booking
        );

        return;
      }


      const user =
        auth.currentUser;

      if (!user) {

        showResult(
          "invalid",
          "ACCESSO STAFF SCADUTO",
          "",
          "",
          ""
        );

        return;
      }


      const idToken =
        await user.getIdToken();


      const response =
        await fetch(

          "https://europe-west1-backtag-16de3.cloudfunctions.net/transmindCheckIn",

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json",

              "Authorization":
                `Bearer ${idToken}`

            },

            body:
              JSON.stringify({
                token
              })

          }

        );


      const data =
        await response.json();


      if (
        data.alreadyUsed === true
      ) {

        showResult(

          "used",

          "⚠️ BIGLIETTO GIÀ SCANSIONATO",

          `${data.name || ""} ${data.surname || ""}`,

          data.ticketLabel || "",

          data.bookingCode || booking

        );

        return;

      }


      if (
        response.ok &&
        data.valid === true
      ) {

        showResult(

          "valid",

          "✓ BIGLIETTO VALIDO",

          `${data.name || ""} ${data.surname || ""}`,

          data.ticketLabel || "",

          data.bookingCode || booking

        );

        return;

      }


      showResult(

        "invalid",

        "✕ BIGLIETTO NON VALIDO",

        "",

        data.error || "",

        booking

      );


    }

    catch (error) {

      console.error(error);

      showResult(

        "invalid",

        "ERRORE",

        "",

        "Impossibile verificare il biglietto.",

        ""

      );

    }

  }


  async function showResult(
    type,
    title,
    name,
    ticket,
    code
  ) {

    try {

      if (
        scanner &&
        scanner.isScanning
      ) {

        await scanner.stop();

      }

    }

    catch (_) {}


    scannerBox.style.display =
      "none";


    result.className =
      type;


    result.style.display =
      "block";


    resultTitle.textContent =
      title;


    resultName.textContent =
      name;


    resultTicket.textContent =
      ticket
        ? "Biglietto: " + ticket
        : "";


    resultCode.textContent =
      code
        ? "Codice: " + code
        : "";

  }


  nextButton.addEventListener(
    "click",
    async () => {

      await startScanner();

    }
  );

</script>

</body>
</html>
